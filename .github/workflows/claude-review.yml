name: Claude Security Review

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write
  contents: read

jobs:
  security:
    # Job-level skip is intentionally removed: a job-level `if` that evaluates
    # to false causes GitHub Actions to report the job as "skipped", which does
    # NOT satisfy a required status check — the check stays "expected" forever
    # and blocks merge. Step-level conditions below keep the same behaviour
    # (dependabot PRs skip the actual review) while the job always exits 0,
    # satisfying the required check.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Dependabot-triggered pull_request runs get NO repository secrets
      # (GitHub policy) — ANTHROPIC_API_KEY is empty and the action would fail.
      # Dependency bumps carry no reviewable app code; emit success and stop.
      - name: Skip security review for dependabot
        if: github.actor == 'dependabot[bot]'
        run: echo "Dependabot PR — no app code to review. Emitting success for required check."

      - name: Checkout
        if: github.actor != 'dependabot[bot]'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Claude Code Security Review
        if: github.actor != 'dependabot[bot]'
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          exclude-directories: "node_modules,dist,.next,knowledge-base/venv,orgs"
